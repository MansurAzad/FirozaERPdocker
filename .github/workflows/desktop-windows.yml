name: Windows desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify tagged release version
        shell: pwsh
        run: |
          $releaseTag = "${{ inputs.release_tag || github.ref_name }}"
          $tagVersion = $releaseTag.Substring(1)
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.toml -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if ($tagVersion -ne $appVersion -or $tagVersion -ne $cargoVersion) {
            throw "Tag v$tagVersion must match both Tauri and Cargo versions (Tauri: $appVersion; Cargo: $cargoVersion)."
          }

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: FIROZA ENTERPRISE ${{ inputs.release_tag || github.ref_name }}
          releaseBody: Windows NSIS installer for direct download. This installer is not code-signed.
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.ci.conf.json
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Preserve Windows installer for release recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ inputs.release_tag || github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: warn
          retention-days: 1
