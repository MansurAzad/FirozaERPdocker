name: Windows desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify tagged release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.toml -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if ($tagVersion -ne $appVersion -or $tagVersion -ne $cargoVersion) {
            throw "Tag v$tagVersion must match both Tauri and Cargo versions (Tauri: $appVersion; Cargo: $cargoVersion)."
          }

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FIROZA ENTERPRISE ${{ github.ref_name }}
          releaseBody: Windows NSIS installer for direct download. This installer is not code-signed.
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.ci.conf.json
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
