[package]
name = "firoza-erp"
version = "1.0.2"
description = "Firoza ERP desktop application"
authors = ["Firoza Enterprise"]
edition = "2021"

[lib]
name = "firoza_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde_json = "1"
