name: Windows desktop app

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before publishing a signed release."
          }

      - name: Bump desktop patch version and push release tag
        id: bump
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $cargoPath = "src-tauri/Cargo.toml"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $cargo = Get-Content $cargoPath -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $cargoVersion -or $cargoVersion -ne $config.version) {
            throw "Tauri config version and Cargo.toml version must match."
          }

          $versions = @($config.version)
          foreach ($tag in (git tag --list "v*")) {
            if ($tag -match '^v(\d+\.\d+\.\d+)$') { $versions += $Matches[1] }
          }
          $latest = $versions | ForEach-Object { [version]$_ } | Sort-Object | Select-Object -Last 1
          $nextVersion = "{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
          $config.version = $nextVersion
          [System.IO.File]::WriteAllText(
            $configPath,
            ($config | ConvertTo-Json -Depth 100) + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          $cargo = [regex]::Replace(
            $cargo,
            '(?m)^(version\s*=\s*")[^"]+(")',
            [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              $match.Groups[1].Value + $nextVersion + $match.Groups[2].Value
            }
          )
          [System.IO.File]::WriteAllText($cargoPath, $cargo, [System.Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $configPath $cargoPath
          git commit -m "chore: release desktop v$nextVersion"
          git tag -a "v$nextVersion" -m "FIROZA ENTERPRISE v$nextVersion"
          git push origin HEAD:main
          git push origin "refs/tags/v$nextVersion"
          "tag_name=v$nextVersion" >> $env:GITHUB_OUTPUT

      - name: Verify tagged release version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before publishing a signed release."
          }
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Tag v$tagVersion does not match desktop version $appVersion"
          }

      - name: Build and publish signed auto-update release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || steps.bump.outputs.tag_name }}
          releaseName: FIROZA ENTERPRISE ${{ github.ref_type == 'tag' && github.ref_name || steps.bump.outputs.tag_name }}
          releaseBody: Signed Windows installer and updater metadata. Installed desktop apps check for updates on startup and can install them automatically.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
